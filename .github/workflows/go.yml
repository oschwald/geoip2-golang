name: Go

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs for the same pull request. Other events get a
# unique group so they never cancel each other.
concurrency:
  group: go-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generated:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.26.x

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Regenerate models
        run: go generate ./...

      - name: Verify generated files are current
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

  build:
    name: Build
    strategy:
      matrix:
        go-version: [1.27.x, 1.26.x]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v .

      - name: Test
        run: go test -race -v ./...

      # Model fields use uint, which is 32 bits on 386. The race detector
      # does not support 386, so this run is without -race.
      - name: Test on 32-bit (386)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
          GOARCH: "386"
        run: go test -v ./...
